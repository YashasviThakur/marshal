# Run Marshal's dashboard next to a self-hosted Flagsmith:
#   docker compose -f docker-compose.yml -f compose.marshal.yml up -d marshal
# Point it at your Flagsmith's service names (here: flagsmith, flagsmith-db) and an experiment.
# Dashboard is read-only. To let Marshal move traffic, run `python -m marshal_ab run --mode act --every 15` (see README).
services:
  marshal:
    build: .
    ports: ['8765:8765']
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      FLAGSMITH_API_KEY: ${FLAGSMITH_API_KEY:?an organisation admin API key}
      EXPERIMENT_ENV_KEY: ${EXPERIMENT_ENV_KEY:?the environment key the experiment runs in}
      EXPERIMENT_ID: ${EXPERIMENT_ID:?the experiment id}
      MARSHAL_WAREHOUSE_DSN: postgresql://postgres:password@flagsmith-db:5432/flagsmith
    depends_on: [flagsmith]
