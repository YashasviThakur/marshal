<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marshal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;--a:#3b5bdb;--b:#e8590c;--good:#2b8a3e;--bad:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8eaed;--mute:#98a2b3;--line:#2a2f39;--a:#748ffc;--b:#ff922b;--good:#51cf66;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}h1{font-size:22px;margin:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.sub{color:var(--mute);margin:2px 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500;font-size:13px}tr:last-child td{border-bottom:0}
.winner{color:var(--good);font-weight:600}.loser{color:var(--bad);font-weight:600}.undecided{color:var(--mute)}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar div{display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:600;transition:width .6s}
.err{color:var(--bad)}input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:110px}
svg{width:100%;height:150px}.legend span{margin-right:14px;color:var(--mute)}
</style></head><body><main>
<h1 id="title">Marshal</h1><p class="sub" id="sub">loading…</p><p class="err" id="err"></p>
<div class="card"><h2>Traffic being served</h2><div class="bar" id="bar"></div><div id="hist"></div><div class="legend" id="legend"></div></div>
<div class="card"><h2>Evidence (always-valid: safe to watch continuously)</h2><table id="arms"></table></div>
<div class="card"><h2>Taken apart by trait <input id="trait" value="device" aria-label="trait"></h2><table id="segs"></table></div>
<div class="card"><h2>Guardrails and decisions</h2><div id="guards"></div><table id="log"></table></div>
</main><script>
const $=id=>document.getElementById(id),pct=x=>x==null?'–':(x*100).toFixed(1)+'%',sg=x=>x==null?'–':(x>=0?'+':'')+(x*100).toFixed(1)+'%';
const col=v=>v==='control'?'var(--a)':'var(--b)';
const verdict=v=>v?`<span class="${v}">${v}</span>`:'';
async function load(){
  const r=await fetch('/api/state?trait='+encodeURIComponent($('trait').value)),d=await r.json();
  if(d.error){$('err').textContent=d.error;return}
  $('err').textContent='';
  $('title').textContent=d.experiment;
  $('sub').textContent=`${d.status} · steering metric: ${d.metric} · updated ${new Date().toLocaleTimeString()}`;
  $('bar').innerHTML=Object.entries(d.served).map(([v,s])=>`<div style="width:${s*100}%;background:${col(v)}">${s>.1?v+' '+Math.round(s*100)+'%':''}</div>`).join('');
  $('arms').innerHTML='<tr><th>variant<th>identities<th>rate<th>lift vs control<th>always-valid interval<th>chance best<th>verdict</tr>'+
    d.arms.map(a=>`<tr><td>${a.variant}<td>${a.n.toLocaleString()}<td>${pct(a.mean)}<td>${sg(a.lift)}<td>${a.low==null?'–':sg(a.low)+' to '+sg(a.high)}<td>${pct(a.chance_best)}<td>${verdict(a.verdict)}</tr>`).join('');
  $('segs').innerHTML=`<tr><th>${d.trait}<th>variant<th>identities<th>rate<th>lift<th>interval<th>verdict</tr>`+
    d.segments.map(a=>`<tr><td>${a.segment}<td>${a.variant}<td>${a.n.toLocaleString()}<td>${pct(a.mean)}<td>${sg(a.lift)}<td>${sg(a.low)} to ${sg(a.high)}<td>${verdict(a.verdict)}</tr>`).join('');
  const h=d.history.filter(x=>x.served),keys=Object.keys(d.served);
  if(h.length>1){
    const w=600,ht=130,x=i=>10+i*(w-20)/(h.length-1),y=v=>ht-5-v*(ht-10);
    $('hist').innerHTML=`<svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none">`+keys.map(k=>`<polyline fill="none" stroke="${col(k)}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${h.map((p,i)=>x(i)+','+y(p.served[k]||0)).join(' ')}"/>`).join('')+'</svg>';
    $('legend').innerHTML=keys.map(k=>`<span style="color:${col(k)}">● ${k}</span>`).join('')+'<span>share of traffic, one point per decision</span>';
  }
  $('guards').innerHTML=d.guardrails.length?d.guardrails.map(g=>`<p>${g.metric}: ${g.breaches.length?'<span class="loser">breached by '+g.breaches.join(', ')+'</span>':'<span class="winner">within bounds</span>'}</p>`).join(''):'<p class="undecided">No guardrail metrics on this experiment.</p>';
  $('log').innerHTML='<tr><th>time<th>served<th>decision</tr>'+d.history.slice(-8).reverse().map(p=>`<tr><td>${p.at.slice(11)}<td>${Object.entries(p.served).map(([k,v])=>k+' '+Math.round(v*100)+'%').join(' / ')}<td>${p.decision}</tr>`).join('');
}
$('trait').onchange=load;load();setInterval(load,10000);
</script></body></html>
